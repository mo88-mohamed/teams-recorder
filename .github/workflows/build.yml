name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/TeamsObsRecorder.Tests

      - name: Publish Windows and Linux executables
        run: |
          dotnet publish src/TeamsObsRecorder -c Release -f net8.0-windows10.0.17763.0 -r win-x64 -o publish/win-x64
          dotnet publish src/TeamsObsRecorder -c Release -f net8.0 -r linux-x64 -o publish/linux-x64
          cp config.example.json publish/win-x64/ && cp config.example.json publish/linux-x64/
          (cd publish/win-x64 && zip -9 ../TeamsObsRecorder-win-x64.zip *)
          (cd publish/linux-x64 && chmod +x TeamsObsRecorder && zip -9 ../TeamsObsRecorder-linux-x64.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: TeamsObsRecorder
          path: publish/*.zip

      # A push to main with a new <Version> in the .csproj publishes release v<Version>.
      - name: Create release for a new version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -oP '(?<=<Version>)[^<]+' src/TeamsObsRecorder/TeamsObsRecorder.csproj)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump <Version> to publish a new one."
          else
            gh release create "$tag" publish/*.zip --target "$GITHUB_SHA" --title "Teams OBS Recorder $tag" --generate-notes
          fi
